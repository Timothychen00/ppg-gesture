[project]
name = "host"
version = "0.1.0"
description = "Heart-rate dashboard and PPG gesture recognition for an ESP32 + MAX30102"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pyqt6>=6.5",
    "pyqtgraph>=0.13.3",
    "pyserial>=3.5",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
